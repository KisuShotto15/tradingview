<svg width="100" height="100" viewBox="0 0 100 100" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Kisu Charts</title>
  <style>
    .mono { font-family: system-ui, sans-serif; font-weight: 800; dominant-baseline: middle; }
    .k { fill: #e6e6e6; text-anchor: end; }
    .c { fill: #26a69a; text-anchor: start; }
    .step { fill: #26a69a; }
  </style>

  <rect width="100" height="100" rx="16" fill="#000000"/>

  <text x="50" y="47" class="mono k" font-size="52">K</text>
  <text x="50" y="47" class="mono c" font-size="52">C</text>

  <!-- Ascending steps: reads as a chart at favicon size, where the letters don't. -->
  <rect x="20" y="82" width="16" height="4" rx="2" class="step" opacity="0.35"/>
  <rect x="42" y="78" width="16" height="8" rx="2" class="step" opacity="0.65"/>
  <rect x="64" y="72" width="16" height="14" rx="2" class="step"/>
</svg>
