<svg width="100" height="100" viewBox="0 0 100 100" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>TV icon</title>
  <style>
    .lt { font-family: system-ui, sans-serif; font-weight: 800; dominant-baseline: middle; fill: #ffffff; text-anchor: end; }
    .lv { font-family: system-ui, sans-serif; font-weight: 800; dominant-baseline: middle; fill: #9b5de5; text-anchor: start; }
    .bar { fill: #9b5de5; }
    .bar-dim { fill: #9b5de5; opacity: 0.28; }
  </style>

  <rect width="100" height="100" rx="16" fill="#000000"/>

  <line x1="50" y1="16" x2="50" y2="76" stroke="#9b5de5" stroke-width="0.8" opacity="0.35"/>

  <text x="47" y="51" class="lt" font-size="62">T</text>
  <text x="53" y="51" class="lv" font-size="62">V</text>

  <rect x="14" y="83" width="20" height="3.5" rx="1.75" class="bar-dim"/>
  <rect x="40" y="83" width="20" height="3.5" rx="1.75" class="bar"/>
  <rect x="66" y="83" width="20" height="3.5" rx="1.75" class="bar-dim"/>
</svg>
